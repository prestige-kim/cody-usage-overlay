name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Package macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - name: Validate version and build
        env: { RELEASE_TAG: "${{ inputs.tag || github.ref_name }}" }
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$app_version"
          ./scripts/check.sh
          ./scripts/package-release.sh "$RUNNER_TEMP"
          test -f dist/CodyUsageOverlay.app/Contents/Resources/CodyUsageOverlay.icns
          test -f dist/CodyUsageOverlay.app/Contents/Resources/cody-usage-emoticon.png
          (cd "$RUNNER_TEMP" && shasum -a 256 -c CodyUsageOverlay-*-arm64.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ runner.temp }}/CodyUsageOverlay-*-arm64.zip*

  windows:
    name: Package Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Validate version and package
        shell: pwsh
        env: { RELEASE_TAG: "${{ inputs.tag || github.ref_name }}" }
        run: |
          [xml]$props = Get-Content windows/Directory.Build.props
          if ($env:RELEASE_TAG -ne "v$($props.Project.PropertyGroup.Version)") { throw 'Windows version does not match tag' }
          dotnet run --project windows/tests/CodyUsageOverlay.Checks/CodyUsageOverlay.Checks.csproj -c Release
          ./windows/scripts/package.ps1 -OutputDirectory "$env:RUNNER_TEMP"
          $stage = Join-Path $env:RUNNER_TEMP 'icon-check'
          Expand-Archive (Get-ChildItem "$env:RUNNER_TEMP/CodyUsageOverlay-*-windows-x64.zip" | Select-Object -First 1).FullName $stage
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Join-Path $stage 'app/CodyUsageOverlay.exe'))
          if (-not $icon -or $icon.Width -lt 16 -or $icon.Height -lt 16) { throw 'Embedded Windows app icon missing' }
          $icon.Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/CodyUsageOverlay-*-windows-x64.zip*

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-assets, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "${{ inputs.tag || github.ref_name }}"
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == v0.* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "Cody Usage Overlay $RELEASE_TAG" "${prerelease[@]}"
