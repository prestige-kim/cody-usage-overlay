name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build GitHub Release
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "${REQUESTED_TAG#v}" != "$REQUESTED_TAG"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$REQUESTED_TAG" = "v$app_version"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Run core checks
        run: ./scripts/check.sh

      - name: Build app bundle
        run: ./scripts/build.sh

      - name: Validate app bundle
        run: |
          plutil -lint dist/CodyUsageOverlay.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/CodyUsageOverlay.app
          file dist/CodyUsageOverlay.app/Contents/MacOS/CodyUsageOverlay | grep -q arm64

      - name: Package release assets
        run: |
          ./scripts/package-release.sh "$PWD"
          shasum -a 256 -c CodyUsageOverlay-*.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == v0.* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            CodyUsageOverlay-*.zip CodyUsageOverlay-*.zip.sha256 \
            --verify-tag --generate-notes --title "Cody Usage Overlay $RELEASE_TAG" \
            "${prerelease[@]}"
