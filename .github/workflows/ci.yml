name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and check (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Run core checks
        run: ./scripts/check.sh

      - name: Build app bundle
        run: ./scripts/build.sh

      - name: Validate bundle
        run: |
          test -x dist/CodyUsageOverlay.app/Contents/MacOS/CodyUsageOverlay
          plutil -lint dist/CodyUsageOverlay.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/CodyUsageOverlay.app
          file dist/CodyUsageOverlay.app/Contents/MacOS/CodyUsageOverlay | grep -q arm64

      - name: Package and inspect distribution
        run: |
          ./scripts/package-release.sh "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c CodyUsageOverlay-*.zip.sha256)
          mkdir "$RUNNER_TEMP/unpacked"
          ditto -x -k "$RUNNER_TEMP"/CodyUsageOverlay-*.zip "$RUNNER_TEMP/unpacked"
          test -x "$RUNNER_TEMP"/unpacked/CodyUsageOverlay-*-arm64/Install.command
          test -x "$RUNNER_TEMP"/unpacked/CodyUsageOverlay-*-arm64/Uninstall.command
          test -x "$RUNNER_TEMP"/unpacked/CodyUsageOverlay-*-arm64/dist/CodyUsageOverlay.app/Contents/MacOS/CodyUsageOverlay

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodyUsageOverlay-${{ github.sha }}
          path: |
            ${{ runner.temp }}/CodyUsageOverlay-*.zip
            ${{ runner.temp }}/CodyUsageOverlay-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
