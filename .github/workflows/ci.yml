name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and check (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Run core checks
        run: ./scripts/check.sh

      - name: Build app bundle
        run: ./scripts/build.sh

      - name: Validate bundle
        run: |
          test -x dist/CodyUsageOverlay.app/Contents/MacOS/CodyUsageOverlay
          plutil -lint dist/CodyUsageOverlay.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/CodyUsageOverlay.app/Contents/Info.plist)" = "CodyUsageOverlay.icns"
          test -f dist/CodyUsageOverlay.app/Contents/Resources/CodyUsageOverlay.icns
          test -f dist/CodyUsageOverlay.app/Contents/Resources/cody-usage-menubar.png
          codesign --verify --deep --strict --verbose=2 dist/CodyUsageOverlay.app
          file dist/CodyUsageOverlay.app/Contents/MacOS/CodyUsageOverlay | grep -q arm64

      - name: Package and inspect distribution
        run: |
          ./scripts/package-release.sh "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c CodyUsageOverlay-*.zip.sha256)
          mkdir "$RUNNER_TEMP/unpacked"
          ditto -x -k "$RUNNER_TEMP"/CodyUsageOverlay-*.zip "$RUNNER_TEMP/unpacked"
          test -x "$RUNNER_TEMP"/unpacked/CodyUsageOverlay-*-arm64/Install.command
          test -x "$RUNNER_TEMP"/unpacked/CodyUsageOverlay-*-arm64/Uninstall.command
          test -x "$RUNNER_TEMP"/unpacked/CodyUsageOverlay-*-arm64/Doctor.command
          test -x "$RUNNER_TEMP"/unpacked/CodyUsageOverlay-*-arm64/scripts/doctor.py
          test -x "$RUNNER_TEMP"/unpacked/CodyUsageOverlay-*-arm64/dist/CodyUsageOverlay.app/Contents/MacOS/CodyUsageOverlay

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodyUsageOverlay-${{ github.sha }}
          path: |
            ${{ runner.temp }}/CodyUsageOverlay-*.zip
            ${{ runner.temp }}/CodyUsageOverlay-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build and check (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Windows solution
        run: dotnet build windows/CodyUsageOverlay.Windows.sln -c Release

      - name: Run Windows core checks
        run: dotnet run --project windows/tests/CodyUsageOverlay.Checks/CodyUsageOverlay.Checks.csproj -c Release --no-build

      - name: Package Windows release
        shell: pwsh
        run: ./windows/scripts/package.ps1 -OutputDirectory "$env:RUNNER_TEMP"

      - name: Validate Windows package
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP/CodyUsageOverlay-*-windows-x64.zip" | Select-Object -First 1
          if (-not $archive) { throw 'Windows archive missing' }
          $checksum = Get-Content "$($archive.FullName).sha256"
          if (-not $checksum.StartsWith((Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant())) { throw 'Checksum mismatch' }
          if ([IO.File]::ReadAllText("$($archive.FullName).sha256").Contains("`r")) { throw 'Checksum must use LF line endings' }
          Expand-Archive $archive.FullName "$env:RUNNER_TEMP/unpacked"
          @('app/CodyUsageOverlay.exe','install.ps1','uninstall.ps1','doctor.ps1') | ForEach-Object {
            if (-not (Test-Path (Join-Path "$env:RUNNER_TEMP/unpacked" $_))) { throw "Missing $_" }
          }
          Add-Type -AssemblyName System.Drawing
          $exe = Join-Path "$env:RUNNER_TEMP/unpacked" 'app/CodyUsageOverlay.exe'
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if (-not $icon -or $icon.Width -lt 16 -or $icon.Height -lt 16) { throw 'Embedded Windows app icon missing' }
          $icon.Dispose()

      - name: Upload Windows CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodyUsageOverlay-Windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/CodyUsageOverlay-*-windows-x64.zip
            ${{ runner.temp }}/CodyUsageOverlay-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
